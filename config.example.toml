# Copy to config.toml and fill in.

# The node only acts on direct messages; channel messages are ignored.

# New nodes heard advertising are added to the radio's contacts if their type
# is listed: chat, repeater, room, sensor. Only chat nodes can message us.
# Enabling this puts the radio in manual-add mode (a setting stored on the
# radio). Remove this section to leave the radio's own behavior alone.
[contacts]
auto_add = ["chat"]
# Send each admin a direct message when a contact is added, e.g.
# "New contact: Alice (a1b2c3d4e5f6, chat)". On by default.
notify_admins = true
# At most this many new nodes are added per hour (users and admins always
# are), and this many new-contact notices sent one by one; the rest come in
# one summary per hour. 0 means no limit.
max_new_per_hour = 20
notices_per_hour = 5

# How often each sender may use each command (per minute, hour or day, or
# "none"), unless the command's entry sets rate = "...". Over 24 hours,
# emails_per_day caps each sender's quickim, emailall and email commands (one
# each, however many addresses), and emails_per_day_total the addresses
# emailed by everyone; 0 for no cap.
# These are the defaults.
[limits]
public_rate = "10/hour"
user_rate = "30/hour"
admin_rate = "none"
emails_per_day = 50
emails_per_day_total = 200

# Which commands run, and who may use each:
#   "public"   anyone who can direct-message the node
#   "user"     senders with a [users.<key>] section in users.toml
#   "admin"    senders listed in users.toml [admin] keys (admins are not
#              automatically users)
#   "disabled" nobody
# An installed command with no entry here is disabled (with a warning at
# startup). An unknown command or level stops startup. Optional per command:
# timeout = <seconds> (default 60), rate = "5/hour"; any other key is passed
# to the command.
[commands]
help = { permission = "public" }
wx = { permission = "public" }
verse = { permission = "public" }
quickim = { permission = "user" }
emailall = { permission = "user" }
email = { permission = "user" }
advert = { permission = "admin" }
reload = { permission = "admin" }
ok = { permission = "public" }
status = { permission = "public" }
clearstatus = { permission = "admin" }
roster = { permission = "user" }
msg = { permission = "user" }
inbox = { permission = "user" }
clearinbox = { permission = "user" }
setpass = { permission = "user" }
alert = { permission = "admin" }
join = { permission = "public" }
approve = { permission = "admin" }
deny = { permission = "admin" }
setquickim = { permission = "user" }
addgroup = { permission = "user" }
cleargroup = { permission = "user" }
users = { permission = "admin" }
whois = { permission = "admin" }
remove = { permission = "admin" }
rename = { permission = "admin" }
resetpass = { permission = "admin" }
whoami = { permission = "user" }
leave = { permission = "user" }
users = { permission = "admin" }
whois = { permission = "admin" }
remove = { permission = "admin" }
rename = { permission = "admin" }
resetpass = { permission = "admin" }
whoami = { permission = "user" }
leave = { permission = "user" }

# alert posts to a public hashtag channel (added to the radio if missing):
# [commands.alert]
# permission = "admin"
# channel = "#contingency-wx"

# A command from an installed package (pip install <package>) needs only a
# permission. Your own code, packaged or not, can be named with handler =
# "module:attr" (the module must be importable, e.g. on PYTHONPATH):
#
# [commands.roll]
# handler = "mesh_dice:roll"
# permission = "public"
# max_dice = 10        # an option for the command itself

# Users and admins are in their own file, which the bot reloads while it runs
# (see users.example.toml). These are the defaults:
# [directory]
# file = "users.toml"   # relative to this file
# reload_seconds = 5    # how often to check it for changes; 0 = only on
#                       # the reload command or SIGHUP
