# Copy to config.toml and fill in (install.sh does it for you). The bot reads
# it when it starts, so restart it after a change:
#   systemctl --user restart mesh-contingency
#
# Everything is posted to MeshCore's Public channel, which every radio has.

# Weather alerts from the National Weather Service for these counties, each
# posted once ("Name, ST"). Empty turns them off.
[alerts]
counties = []                  # e.g. ["Taylor, TX", "Jones, TX"]
every_minutes = 10             # how often to check; at least 5
# Post only some alerts, by the NWS's severity (Extreme, Severe, Moderate,
# Minor, Unknown) and/or by event name (any case). An alert is posted if it
# passes every filter set; leave both out to post every alert.
# severity = ["Extreme", "Severe"]
# events = ["Tornado Warning", "Severe Thunderstorm Warning", "Flash Flood Warning"]

# A weekly test message, followed by the counties, so people know the alerts
# get through. testalert posts it on request.
[alert_test]
weekly = ""                    # e.g. "Wednesday 17:00" or "Wed 5:00PM"; empty for none
# timezone = "America/Chicago" # defaults to the computer's
# message = "TEST: this is a test of the weather alerts on this channel. No action needed."

# The radios that may send alert and testalert: each one's full public key (64
# hex digits; in the MeshCore app, share your contact to see it).
[admins]
keys = []                      # e.g. ["a1b2...", "c3d4..."]

# Adverts let other radios find the node, so admins can message it. The next
# one goes out every_hours after the last, even across restarts.
[advert]
every_hours = 0      # 0 for never; 12 is a good choice
flood = true         # flood (across the mesh) or zero-hop (in direct range)
at_startup = false   # also advert every time the bot starts

# Who may use each command: "admin" (the radios above), "public" (anyone who
# can message the node) or "disabled".
[commands]
help = { permission = "admin" }
alert = { permission = "admin" }
testalert = { permission = "admin" }
