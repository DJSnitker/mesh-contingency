name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs (a tag can be moved to other code); the
# comment names the version, and Dependabot proposes updates to both.

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Installing registers the built-in commands' entry points, which the
      # tests rely on.
      - run: python -m pip install -e .
      - run: python -m unittest -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --output-format=github .

  package:
    name: Package and plugin install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check the wheel contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = wheel.namelist()
          assert "mesh_contingency/bible/bsb.json.gz" in names, "bundled Bible missing"
          assert not any(n.startswith("mesh_contingency/web/") for n in names), "the web console was removed"
          for secret in ("config.toml", "users.toml"):
              assert not any(n.endswith(secret) for n in names), f"{secret} must never be packaged"
          entry_points = wheel.read(next(n for n in names if n.endswith("entry_points.txt"))).decode()
          assert "[mesh_contingency.commands]" in entry_points, entry_points
          print(entry_points)
          EOF
      # A clean install from the wheel (not the source tree), plus the example
      # third-party package, to prove plugins are discovered and run.
      - name: Install the wheel and the example plugin
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl ./examples/mesh-dice
      - name: Smoke test
        working-directory: /tmp
        run: |
          /tmp/venv/bin/mesh-contingency --help
          /tmp/venv/bin/python - <<'EOF'
          import asyncio
          import os
          import tomllib
          from pathlib import Path
          from mesh_contingency.api import Sender
          from mesh_contingency.directory import Directory
          from mesh_contingency.registry import Registry, discover

          # Every command the bot and the example plugin declare, so a new one
          # can't be left out of this check.
          source = Path(os.environ["GITHUB_WORKSPACE"])
          declared = set()
          for pyproject in (source / "pyproject.toml", source / "examples/mesh-dice/pyproject.toml"):
              project = tomllib.loads(pyproject.read_text())["project"]
              declared |= set(project["entry-points"]["mesh_contingency.commands"])
          assert {"help", "backup", "roll", "flip"} <= declared, declared
          found = discover()
          missing = declared - set(found)
          assert not missing, f"commands not discovered: {missing}"
          print(f"{len(declared)} commands discovered")

          config = {"commands": {"verse": {"permission": "public"}, "roll": {"permission": "public"}}}
          commands = Registry(config).build(Directory(), None)
          dana = Sender("Dana", "d0" * 32)
          verse = asyncio.run(commands["verse"].execute("john 3:16", dana))
          roll = asyncio.run(commands["roll"].execute("2d6", dana))
          print(verse.reply, roll, sep="\n")
          assert verse.reply[0].startswith("(1/2) John 3:16 For God so loved the world")
          assert roll.startswith("Dana rolled 2d6: ")
          EOF

  install:
    name: Install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: shellcheck install.sh
      # Installs this commit (from a branch here, as the clone needs one) with
      # the system's Python, then runs again as an update: the config stays.
      - name: Fresh install, then an update
        run: |
          git switch -c ci-install
          export MC_REPO="file://$PWD"
          ./install.sh --dir ~/node --ref ci-install --no-service
          ~/node/.venv/bin/python -c "import mesh_contingency"
          echo "# kept" >> ~/node/config.toml
          ./install.sh --dir ~/node --ref ci-install --no-service
          grep -q "# kept" ~/node/config.toml
      # The radio check, with stand-ins for the port: one no group can open,
      # and one the runner's user can.
      - name: Radio port check
        run: |
          export MC_REPO="file://$PWD"
          touch locked ok && chmod 000 locked && chmod 600 ok
          MC_PORTS="$PWD/locked" ./install.sh --dir ~/node --ref ci-install --no-service | tee out
          grep -q "and no group can" out
          MC_PORTS="$PWD/ok" ./install.sh --dir ~/node --ref ci-install --no-service 2>&1 | tee out
          grep -q "you can use it" out
      # A new install's channels, from the options (CI has no terminal to ask on).
      - name: Channels
        run: |
          export MC_REPO="file://$PWD"
          ./install.sh --dir ~/node2 --ref ci-install --no-service \
              --alert-channel district7-wx --comm-channel '#d7-comm'
          grep -q '^alert = .*channel = "#district7-wx"' ~/node2/config.toml
          grep -q '^comm = .*channel = "#d7-comm"' ~/node2/config.toml
          ! ./install.sh --dir ~/node3 --alert-channel 'bad name!'
      # --check stops before starting anything while users.toml has the
      # example admin key (CI has no user systemd to start the service with).
      - name: Check mode
        run: |
          ! ./install.sh --check --dir ~/node2 | tee out
          grep -q "example admin key" out
