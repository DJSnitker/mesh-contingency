name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs (a tag can be moved to other code); the
# comment names the version, and Dependabot proposes updates to both.

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Installing registers the built-in commands' entry points, which the
      # tests rely on; the console extra (aiohttp) is for the web console's.
      - run: python -m pip install -e ".[console]"
      - run: python -m unittest -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --output-format=github .

  console:
    name: Web console app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  app:
    name: Phone app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The Android Gradle plugin is tested on Java 17 and 21; the runner has
      # the Android SDK already.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/**/gradle-wrapper.properties
      - run: npm ci
      # Builds the Angular app and copies it into the Android project.
      - run: npm run android
      - name: Build the debug APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug
      # Unsigned for release: a debug build, to install for trying it out.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mesh-contingency-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  package:
    name: Package and plugin install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json
      # The package ships the web console's app, built here.
      - name: Build the web console app
        working-directory: console
        run: |
          npm ci
          npm run build
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check the wheel contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = wheel.namelist()
          assert "mesh_contingency/bible/bsb.json.gz" in names, "bundled Bible missing"
          assert "mesh_contingency/web/static/index.html" in names, "web console app missing"
          assert any(n.startswith("mesh_contingency/web/static/main-") for n in names), "app script missing"
          assert any(n.endswith(".woff2") for n in names), "bundled fonts missing"
          for secret in ("config.toml", "users.toml"):
              assert not any(n.endswith(secret) for n in names), f"{secret} must never be packaged"
          entry_points = wheel.read(next(n for n in names if n.endswith("entry_points.txt"))).decode()
          assert "[mesh_contingency.commands]" in entry_points, entry_points
          print(entry_points)
          EOF
      # A clean install from the wheel (not the source tree), plus the example
      # third-party package, to prove plugins are discovered and run.
      - name: Install the wheel and the example plugin
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl ./examples/mesh-dice
      - name: Smoke test
        working-directory: /tmp
        run: |
          /tmp/venv/bin/mesh-contingency --help
          /tmp/venv/bin/mesh-contingency-console --help
          /tmp/venv/bin/python - <<'EOF'
          import asyncio
          import os
          import tomllib
          from pathlib import Path
          from mesh_contingency.api import Sender
          from mesh_contingency.directory import Directory
          from mesh_contingency.registry import Registry, discover

          # Every command the bot and the example plugin declare, so a new one
          # can't be left out of this check.
          source = Path(os.environ["GITHUB_WORKSPACE"])
          declared = set()
          for pyproject in (source / "pyproject.toml", source / "examples/mesh-dice/pyproject.toml"):
              project = tomllib.loads(pyproject.read_text())["project"]
              declared |= set(project["entry-points"]["mesh_contingency.commands"])
          assert {"help", "backup", "roll", "flip"} <= declared, declared
          found = discover()
          missing = declared - set(found)
          assert not missing, f"commands not discovered: {missing}"
          print(f"{len(declared)} commands discovered")

          config = {"commands": {"verse": {"permission": "public"}, "roll": {"permission": "public"}}}
          commands = Registry(config).build(Directory(), None)
          dana = Sender("Dana", "d0" * 32)
          verse = asyncio.run(commands["verse"].execute("john 3:16", dana))
          roll = asyncio.run(commands["roll"].execute("2d6", dana))
          print(verse.reply, roll, sep="\n")
          assert verse.reply[0].startswith("(1/2) John 3:16 For God so loved the world")
          assert roll.startswith("Dana rolled 2d6: ")
          EOF
