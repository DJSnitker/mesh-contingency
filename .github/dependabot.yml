# Weekly pull requests to keep GitHub Actions, Python and the web console's
# npm dependencies current.
# Each one runs CI before it can be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    # Angular pins the TypeScript it supports (22.2: >=6.0 <6.1), so newer
    # TypeScript fails the build; it's raised by hand with an Angular upgrade
    # (ng update), not proposed here. Patch releases still are.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "typescript", "zone.js"]
      npm:
        patterns: ["*"]
