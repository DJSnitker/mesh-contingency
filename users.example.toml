# Copy to users.toml (next to config.toml) and fill in. The bot checks this
# file every few seconds while it runs, so changes need no restart; send the
# reload command (admins) or SIGHUP to apply them at once. If an edit is
# invalid, the bot keeps the previous users and tells the admins why.
#
# Keys are full public keys (64 hex characters), shown in the MeshCore app.
# The shorter 12-character prefix is not accepted.
#
# The bot writes to this file too: approve adds a user, remove and leave take
# one out, a radio's new name updates name, setqm, addgroup,
# cleargroup and setemail change a user's addresses, and setpass saves the key their
# mailbox messages are sealed with (inbox_key; never the passphrase), which
# resetpass clears. [admin] keys is never changed by the bot. It rewrites only
# that user's section, dropping comments inside it.

# Admins may run admin commands.
[admin]
keys = ["a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"]

# One section per approved user; having a section is what allows the user to
# run "user" commands. name is the user's radio's name, written when they join
# and kept up to date by the bot; a name typed here is replaced by the radio's
# the next time the bot sees it. The qm and
# emailall keys say where that user's messages are emailed (one address or a
# list); the email command needs no addresses here.

[users.a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2]
name = "Alice T-Deck"
qm = "someone@example.com"
emailall = ["someone@example.com", "someone.else@example.com"]

[users.2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a]
name = "Bob's Heltec"
qm = "bobs.partner@example.com"
