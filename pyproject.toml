[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-contingency"
version = "1.1.0"
description = "MeshCore bot that posts National Weather Service alerts to the Public channel, with admin commands to post and test"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Doug Snitker" }]
requires-python = ">=3.11"
# meshcore is held to the tested minor version, since its API changes between
# them; Dependabot proposes a new range when one is released. mesh-commands is
# in packages/mesh-commands, installed alongside:
#   pip install -e packages/mesh-commands -e .
dependencies = ["meshcore>=2.3.17,<2.4", "mesh-commands>=0.1,<0.2"]

[project.optional-dependencies]
# Development tools; CI's lint job installs these. Pinned so a new lint rule
# can't fail CI unannounced (Dependabot proposes upgrades).
dev = ["ruff==0.17.6"]

[project.urls]
Repository = "https://github.com/DJSnitker/mesh-contingency"

[project.scripts]
mesh-contingency = "mesh_contingency.bot:run"

# Built-in commands, registered the same way a third-party package would.
[project.entry-points."mesh_contingency.commands"]
help = "mesh_commands.builtin.help:HelpCommand"
alert = "mesh_contingency.commands.alert:AlertCommand"
testalert = "mesh_contingency.commands.testalert:TestAlertCommand"
advert = "mesh_contingency.commands.advert:AdvertCommand"

[tool.setuptools.packages.find]
include = ["mesh_contingency*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
